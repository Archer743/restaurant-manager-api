version: '3.9'  # Docker Compose version

services:
  nginx:
    image: nginx:alpine
    container_name: restaurant-manager-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    # Periodically reload Nginx so it can pick up renewed TLS certificates.
    #
    # IMPORTANT:
    # It is NOT a problem if Nginx does not reload immediately after Certbot renews a certificate.
    # Let's Encrypt renews certificates ~30 days before expiration, and the old certificate
    # remains valid until it actually expires.
    entrypoint: sh
    command: -c "
      while :; do
        sleep 12h;
        echo '[nginx] Periodic reload to pick up new certificates';
        nginx -s reload;
      done &
      nginx -g 'daemon off;'"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro # ro - read-only -> nginx won't be able to change the config
      - certbot-etc:/etc/letsencrypt # Https certificate
      - certbot-www:/var/www/certbot # ACME challenge
    depends_on:
      - backend
    networks:
      - restaurant-network
  
  certbot:
    image: certbot/certbot
    container_name: restaurant-manager-certbot
    restart: always
    # Checks twice per day whether any certificate is due for renewal.
    #
    # After renewal, the new certificates are written to the shared volume,
    # and Nginx will pick them up on its next scheduled reload.
    entrypoint: sh
    command: -c "
      trap exit TERM;
      while :; do
        echo '[certbot] Checking certificates for renewal';
        certbot renew --webroot -w /var/www/certbot --quiet;
        sleep 12h;
      done"
    volumes:
      - certbot-etc:/etc/letsencrypt # Stores certificates and keys
      - certbot-www:/var/www/certbot # Used for storing challenge files
      - certbot-var:/var/lib/letsencrypt # Used during validation - temp data
    depends_on:
      - nginx

  backend:
    image: restaurant-manager-backend:latest
    deploy:
      replicas: 2
    restart: always
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - ConnectionStrings__PostgresConnection=Server=db;Database=${POSTGRES_DB};Port=5432;User Id=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};
      - JwtSettings__Issuer=${JWT_ISSUER}
      - JwtSettings__Audience=${JWT_AUDIENCE}
      - JwtSettings__ServerSecretKey=${JWT_SERVER_SECRET_KEY}
      - JwtSettings__AccessTokenLifetime=${JWT_ACCESS_TOKEN_LIFETIME}
      - SessionSettings__RefreshTokenLength=${SESSION_REFRESH_TOKEN_LENGTH}
      - SessionSettings__ServerSecretKey=${SESSION_SERVER_SECRET_KEY}
      - SessionSettings__SessionLifetime=${SESSION_LIFETIME}
      - SessionSettings__RetentionDays=${SESSION_RETENTION_DAYS}
      - ReservationCleanup__RetentionMonths=${RESERVATION_RETENTION_MONTHS}
      - Logging__LogLevel__Default=${LOGGING_LOG_LEVEL_DEFAULT}
      - Logging__LogLevel__Microsoft.AspNetCore=${LOGGING_LOG_LEVEL_MICROSOFT_ASPNETCORE}
      - ASPNETCORE_ALLOWEDHOSTS=${ASPNETCORE_ALLOWED_HOSTS}
    depends_on:
      db:
        condition: service_healthy # Ensure DB is ready
      migrator:
        condition: service_completed_successfully # Wait for successful migration
    networks:
      - restaurant-network

  migrator:
    image: restaurant-manager-backend:latest
    container_name: restaurant-manager-migrator
    restart: "no"
    # profiles: ["migrate"] # Allows manual migration control
    environment:
      - ASPNETCORE_URLS=http://+:8080
      # In order to run the app as a migrator the env must be `Migration`
      - ASPNETCORE_ENVIRONMENT=Migration
      - ConnectionStrings__PostgresConnection=Server=db;Database=${POSTGRES_DB};Port=5432;User Id=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};
      - JwtSettings__Issuer=${JWT_ISSUER}
      - JwtSettings__Audience=${JWT_AUDIENCE}
      - JwtSettings__ServerSecretKey=${JWT_SERVER_SECRET_KEY}
      - JwtSettings__AccessTokenLifetime=${JWT_ACCESS_TOKEN_LIFETIME}
      - SessionSettings__RefreshTokenLength=${SESSION_REFRESH_TOKEN_LENGTH}
      - SessionSettings__ServerSecretKey=${SESSION_SERVER_SECRET_KEY}
      - SessionSettings__SessionLifetime=${SESSION_LIFETIME}
      - SessionSettings__RetentionDays=${SESSION_RETENTION_DAYS}
      - ReservationCleanup__RetentionMonths=${RESERVATION_RETENTION_MONTHS}
      - Logging__LogLevel__Default=${LOGGING_LOG_LEVEL_DEFAULT}
      - Logging__LogLevel__Microsoft.AspNetCore=${LOGGING_LOG_LEVEL_MICROSOFT_ASPNETCORE}
      - ASPNETCORE_ALLOWEDHOSTS=${ASPNETCORE_ALLOWED_HOSTS}
    depends_on:
      db:
        condition: service_healthy # Ensure DB is ready
    networks:
      - restaurant-network

  db:
    image: postgres:18
    container_name: restaurant-manager-db
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_DB: "${POSTGRES_DB}"
    volumes:
      - db_data:/var/lib/postgresql
    networks:
      - restaurant-network

volumes:
  db_data:
  certbot-etc:
  certbot-www:
  certbot-var:

networks:
  restaurant-network:
