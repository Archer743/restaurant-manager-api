worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Removes Nginx version from the http response header field
    server_tokens off;


    # =================================================================
    # GLOBAL SECURITY & PERFORMANCE TUNING

    # Max size of POST/PUT body (protect memory)
    client_max_body_size 2M;

    # Client Timeouts (Protection against Slowloris)
    client_header_timeout 10s; # How long Nginx waits for the client to send HTTP headers
    client_body_timeout 10s; # How long Nginx waits to receive the entire body
    send_timeout 10s; # How long Nginx will keep the connection open while sending a response
    keepalive_timeout 25s; # How long to keep the idle TCP connection open after the request

    # Proxy Timeouts (Crucial for stability with the backend)
    proxy_connect_timeout 5s; # Max time to establish connection with upstream
    proxy_read_timeout 60s;   # Max time between read operations from upstream
    proxy_send_timeout 60s;   # Max time between send operations to upstream


    # =================================================================
    # RATE LIMIT ZONES

    # Returned status code for reaching any rate limit
    limit_req_status 429;

    # Strict for login / register / token refresh (protect from brute force)
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=3r/s;

    # General authenticated API calls (smooth rate with burst)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # Limit concurrent connections per IP (protect from slowloris / resource hogging)
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # TODO: Add limit zone for public anonymous endpoints (moderate limit)


    # =================================================================
    # UPSTREAM
    
    upstream backend_cluster {
        # Load balancing method: send request to the server with the fewest active connections
        least_conn;
        # Nginx will automatically resolve the backend tasks in Docker DNS
        server backend:8080;
    }


    # For testing
    server {
        listen 80;

        # Apply max concurrent connections per IP
        limit_conn conn_limit 20;

        # ======================== Proxy headers
        # Ensure the backend receives the correct context from the original client request
        proxy_set_header Host $host;  # Preserve the original domain name (fallback)
        proxy_set_header X-Forwarded-Host $host; # Preserve the original domain name
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; # Add the client’s IP to a chain of forwarded addresses
        proxy_set_header X-Forwarded-Proto https;

        # proxy_pass - forwards incoming requests to the upstream group via HTTP (SSL termination)

        location ~ ^/api/auth/(login|register|refresh) {
            limit_req zone=auth_limit burst=5 nodelay;
            proxy_pass http://backend_cluster;
        }

        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://backend_cluster;
        }

        location / {
            return 404;
        }
    }


